<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bamex Crue · Admin</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#1e1e2f}.btn{font-weight:600;padding:.65rem 1.4rem;border-radius:10px;cursor:pointer;border:none}.btn-primary{background:#0a66c2;color:#fff}.btn-danger{background:#e74c3c;color:#fff}.btn-sm{padding:.4rem .8rem;font-size:.8rem}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}.login-card{background:#fff;padding:2.5rem;border-radius:20px;width:100%;max-width:400px;box-shadow:0 20px 40px -15px rgba(0,0,0,.1)}.login-card h1{margin-bottom:.5rem}.login-card p{color:#5f5f7a;margin-bottom:1.5rem}.login-card input{width:100%;padding:.9rem 1rem;margin-bottom:1rem;border:1.5px solid #e0e0ec;border-radius:10px}.login-card .btn{width:100%}.login-error{color:#b3261e;background:#fdecea;padding:.7rem;border-radius:10px;margin-bottom:1rem;display:none}#dashboard{display:none}.topbar{background:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}.main{padding:2rem;max-width:1400px;margin:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}.stat-card{background:#fff;padding:1.5rem;border-radius:16px}.stat-card h4{color:#5f5f7a}.num{font-size:2rem;font-weight:700;color:#0a66c2}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:1rem;text-align:left;border-bottom:1px solid #eee;font-size:.9rem}.msg-cell{max-width:340px;white-space:pre-wrap}.empty{text-align:center;padding:3rem}</style></head><body>
<div class="login-wrap" id="loginView"><form class="login-card" id="loginForm"><h1>Admin login</h1><p>Sign in to manage Bamex Crue leads.</p><div class="login-error" id="loginError"></div><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn btn-primary" type="submit">Sign in</button></form></div>
<div id="dashboard"><div class="topbar"><div><strong>Bamex Crue</strong> admin</div><div><a class="btn btn-primary btn-sm" href="/" target="_blank">View site</a> <button class="btn btn-danger btn-sm" id="logoutBtn">Logout</button></div></div><div class="main"><div class="stats" id="statsRow"></div><button class="btn btn-primary btn-sm" id="refreshBtn" style="margin-bottom:1rem">↻ Refresh</button><div id="tableWrap"></div></div></div>
<script src="/js/admin.js"></script></body></html>
